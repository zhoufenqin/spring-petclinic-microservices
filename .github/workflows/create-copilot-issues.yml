name: Create Copilot Issues from References

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  create-issues:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.body, 'github.com')
    
    steps:
      - name: Extract GitHub URLs and create issues
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SOURCE_ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          echo "Parsing issue body for GitHub repository URLs..."
          
          REPOS=$(echo "$ISSUE_BODY" | grep -oP '(?:https://)?github\.com/[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+' | sort -u)
          
          if [ -z "$REPOS" ]; then
            echo "No GitHub repository URLs found in the issue body"
            exit 0
          fi
          
          echo "Found repositories:"
          echo "$REPOS"
          
          while IFS= read -r repo_url; do
            repo_path=$(echo "$repo_url" | sed 's|https://||' | sed 's|github.com/||')
            
            echo "---"
            echo "Creating issue in: $repo_path"
            
            # Create issue
            echo "Creating issue..."
            issue_url=$(gh issue create --repo "$repo_path" --title "Assess the application" --body "Assess my application to find the cloud readiness issues" 2>&1)
            
            if [ $? -ne 0 ]; then
              echo "Failed to create issue in $repo_path"
              gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Failed to create issue in \`$repo_path\`" || true
              continue
            fi
            
            echo "Issue created: $issue_url"
            issue_number=$(echo "$issue_url" | grep -oP 'issues/\K\d+')
            
            if [ -z "$issue_number" ]; then
              echo "Could not extract issue number"
              continue
            fi
            
            # Assign to Copilot with custom_instructions
            echo "Assigning to Copilot with custom instructions..."
            
            CUSTOM_INSTRUCTIONS="Run .github/prompts/appmod-kit.assess.prompt.md $issue_url"$'\n'"You need to update the summary.md to $SOURCE_ISSUE_URL too"
            
            JSON_PAYLOAD=$(jq -n \
              --arg instructions "$CUSTOM_INSTRUCTIONS" \
              '{assignees: ["copilot-swe-agent[bot]"], agent_assignment: {custom_instructions: $instructions}}')
            
            assign_result=$(echo "$JSON_PAYLOAD" | gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$repo_path/issues/$issue_number" \
              --input - 2>&1)
            
            if [ $? -eq 0 ]; then
              echo "Assigned to Copilot with custom instructions"
              gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "✓ Created issue in [\`$repo_path\`]($issue_url) and assigned to @copilot with custom instructions"
            else
              echo "Failed to assign to Copilot: $assign_result"
              gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "⚠️ Created issue in [\`$repo_path\`]($issue_url) but could not auto-assign to @copilot"
            fi
          done <<< "$REPOS"
          
          echo "---"
          echo "Completed processing all repositories"
