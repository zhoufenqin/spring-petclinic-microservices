---
name: Post Assessment Summary to Issue

# This workflow posts the aggregated assessment summary to a GitHub issue
# Trigger it manually or automatically after assessment aggregation

'on':
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to post the summary to'
        required: true
        type: number
        default: 30

jobs:
  post-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if summary file exists
        id: check_file
        run: |
          SUMMARY_FILE=".github/appmod/appcat/result/summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Summary file found at $SUMMARY_FILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✗ Summary file not found at $SUMMARY_FILE"
            exit 1
          fi

      - name: Read summary content
        id: read_summary
        if: steps.check_file.outputs.exists == 'true'
        run: |
          SUMMARY_FILE=".github/appmod/appcat/result/summary.md"
          {
            echo 'summary<<EOF'
            cat "$SUMMARY_FILE"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Post comment to issue
        if: steps.check_file.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          SUMMARY_CONTENT: ${{ steps.read_summary.outputs.summary }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = process.env.SUMMARY_CONTENT;
            const issueNumber = ${{ inputs.issue_number }};

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: summary
              });
              console.log(
                `✓ Successfully posted assessment summary to ` +
                `issue #${issueNumber}`
              );
            } catch (error) {
              console.error(`✗ Failed to post comment: ${error.message}`);
              throw error;
            }
